<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Jeremy.ai</title>
  <desc id="d">Jeremy.ai, an AR surgical-training simulator for Meta Quest 3, built at CalHacks 13. Pipeline: measure, decide, explain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.6" stop-color="#0d2238"/>
      <stop offset="1" stop-color="#0f3b4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="18" fill="url(#glow)"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="86" font-size="15" font-weight="700" letter-spacing="3.5" fill="#5eead4">AR SURGICAL TRAINING  ·  CALHACKS 13</text>
    <text x="60" y="176" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#word)">Jeremy.ai</text>
    <text x="64" y="224" font-size="26" fill="#cbd5e1">Practice the operation until it's yours. Nobody gets hurt.</text>
    <g font-size="15" font-weight="600" fill="#e2e8f0">
      <rect x="64" y="256" width="148" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#7dd3fc" stroke-opacity="0.4"/>
      <text x="138" y="278" text-anchor="middle">Meta Quest 3</text>
      <rect x="224" y="256" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#7dd3fc" stroke-opacity="0.4"/>
      <text x="283" y="278" text-anchor="middle">Unity 6</text>
      <rect x="354" y="256" width="124" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#7dd3fc" stroke-opacity="0.4"/>
      <text x="416" y="278" text-anchor="middle">FastAPI</text>
      <rect x="490" y="256" width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#7dd3fc" stroke-opacity="0.4"/>
      <text x="542" y="278" text-anchor="middle">Claude</text>
      <rect x="606" y="256" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#7dd3fc" stroke-opacity="0.4"/>
      <text x="662" y="278" text-anchor="middle">Cartesia</text>
      <rect x="730" y="256" width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#7dd3fc" stroke-opacity="0.4"/>
      <text x="782" y="278" text-anchor="middle">Convex</text>
    </g>
    <g transform="translate(64 322)" font-size="13" font-weight="700" letter-spacing="2">
      <rect width="226" height="64" rx="12" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="18" y="27" fill="#38bdf8">1  MEASURE</text>
      <text x="18" y="48" font-size="14" font-weight="400" letter-spacing="0" fill="#cbd5e1">Hands and events, no video</text>
      <path d="M236 32H266" stroke="#64748b" stroke-width="2"/>
      <path d="M260 26L268 32L260 38" fill="none" stroke="#64748b" stroke-width="2"/>
      <g transform="translate(276 0)">
        <rect width="226" height="64" rx="12" fill="#0b1220" stroke="#2dd4bf" stroke-opacity="0.8"/>
        <text x="18" y="27" fill="#2dd4bf">2  DECIDE</text>
        <text x="18" y="48" font-size="14" font-weight="400" letter-spacing="0" fill="#cbd5e1">Deterministic Python scores it</text>
      </g>
      <path d="M512 32H542" stroke="#64748b" stroke-width="2"/>
      <path d="M536 26L544 32L536 38" fill="none" stroke="#64748b" stroke-width="2"/>
      <g transform="translate(552 0)">
        <rect width="226" height="64" rx="12" fill="#0b1220" stroke="#fb923c" stroke-opacity="0.7"/>
        <text x="18" y="27" fill="#fb923c">3  EXPLAIN</text>
        <text x="18" y="48" font-size="14" font-weight="400" letter-spacing="0" fill="#cbd5e1">Claude explains, never scores</text>
      </g>
    </g>
    <g transform="translate(1000 96)" text-anchor="middle">
      <rect x="-110" y="0" width="220" height="160" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#7dd3fc" stroke-opacity="0.35"/>
      <text x="0" y="78" font-size="62" font-weight="800" fill="#ffffff">9 of 9</text>
      <text x="0" y="108" font-size="14" fill="#cbd5e1">surveyed medical and bio</text>
      <text x="0" y="128" font-size="14" fill="#cbd5e1">trainees would use it</text>
    </g>
    <g transform="translate(1000 276)" text-anchor="middle">
      <rect x="-110" y="0" width="220" height="110" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#7dd3fc" stroke-opacity="0.35"/>
      <text x="0" y="62" font-size="50" font-weight="800" fill="#ffffff">523</text>
      <text x="0" y="90" font-size="14" fill="#cbd5e1">backend tests passing</text>
    </g>
  </g>
</svg>
